[project]
name = "betteroption"
version = "0.7.2+k"
description = "Decision-oriented job search platform"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14,<2",
    "beautifulsoup4>=4.12,<5",
    "fastapi>=0.115,<1",
    "geonamescache>=3.0,<4",
    "httpx>=0.28,<1",
    "jinja2>=3.1,<4",
    "openai>=2.0,<3",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "pypdf>=6,<7",
    "python-docx>=1.1,<2",
    "python-multipart>=0.0.20,<1",
    "python-dotenv>=1.0,<2",
    "sqlalchemy>=2.0,<3",
    "tzdata>=2025.2",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
extraction = [
    "openai>=2.0,<3",
]
dev = [
    "packaging>=24,<27",
    "pytest>=8.3,<10",
    "pytest-cov>=5,<8",
    "ruff==0.15.22",
]
deployment = [
    "psycopg[binary]>=3.2,<4",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
betteroption = [
    "data/*.csv",
    "data/*.md",
    "data/*.zip",
    "migrations/script.py.mako",
    "web/static/*.css",
    "web/static/*.js",
    "web/templates/*.html",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated.*:starlette.exceptions.StarletteDeprecationWarning",
]

[tool.coverage.run]
branch = true
source = ["betteroption"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
